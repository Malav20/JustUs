name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          npm --prefix apps/web install

      - name: Build Next.js App & Sync iOS
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://djuqnhqedykhectfhzba.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdXFuaHFlZHlraGVjdGZoemJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MzMxNzcsImV4cCI6MjEwMzIwOTE3N30.UhcqK9MfjxuT-XjjiHzpnrRgZKjkyX2IDuh5FMhoO98"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdXFuaHFlZHlraGVjdGZoemJhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzYzMzE3NywiZXhwIjoyMTAzMjA5MTc3fQ.-3pFyBLu28GY1zlWd2yNQp2V4s8qH3ia-BQ_9HwePJk"
          NEXT_PUBLIC_LIVEKIT_URL: "wss://justus-0q7zbww8.livekit.cloud"
          LIVEKIT_API_KEY: "APIukxmynV6MQkR"
          LIVEKIT_API_SECRET: "OiAeIxN1foN0UQTbvdWW4veSRC4rtTNZua64vC9Qzl3A"
          NEXT_PUBLIC_APP_URL: "https://just-us-web.vercel.app"
        run: |
          cd apps/web
          mkdir -p out ios/App/App/public
          npm run build
          npx --yes @capacitor/cli sync ios

      - name: Build Unsigned iOS IPA
        run: |
          cd apps/web/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r JustUS.ipa Payload/

      - name: Upload IPA to Supabase Storage
        env:
          SUPABASE_URL: "https://djuqnhqedykhectfhzba.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdXFuaHFlZHlraGVjdGZoemJhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzYzMzE3NywiZXhwIjoyMTAzMjA5MTc3fQ.-3pFyBLu28GY1zlWd2yNQp2V4s8qH3ia-BQ_9HwePJk"
        run: |
          node scripts/upload-to-supabase.mjs apps/web/ios/App/JustUS.ipa JustUS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustUS-iOS-IPA
          path: apps/web/ios/App/JustUS.ipa

      - name: Release IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "JustUS Latest App Releases"
          draft: false
          prerelease: false
          files: |
            apps/web/ios/App/JustUS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
