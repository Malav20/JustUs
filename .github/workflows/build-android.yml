name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm --prefix apps/web install

      - name: Build Next.js App & Sync Android
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://djuqnhqedykhectfhzba.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdXFuaHFlZHlraGVjdGZoemJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MzMxNzcsImV4cCI6MjEwMzIwOTE3N30.UhcqK9MfjxuT-XjjiHzpnrRgZKjkyX2IDuh5FMhoO98"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdXFuaHFlZHlraGVjdGZoemJhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzYzMzE3NywiZXhwIjoyMTAzMjA5MTc3fQ.-3pFyBLu28GY1zlWd2yNQp2V4s8qH3ia-BQ_9HwePJk"
          NEXT_PUBLIC_LIVEKIT_URL: "wss://justus-0q7zbww8.livekit.cloud"
          LIVEKIT_API_KEY: "APIukxmynV6MQkR"
          LIVEKIT_API_SECRET: "OiAeIxN1foN0UQTbvdWW4veSRC4rtTNZua64vC9Qzl3A"
          NEXT_PUBLIC_APP_URL: "https://just-us-web.vercel.app"
        run: |
          cd apps/web
          mkdir -p out android/app/src/main/assets
          npm run build
          npx --yes @capacitor/cli sync android

      - name: Build Debug APK with Gradle
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Output
        run: |
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk JustUS.apk

      - name: Upload APK to Supabase Storage
        env:
          SUPABASE_URL: "https://djuqnhqedykhectfhzba.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdXFuaHFlZHlraGVjdGZoemJhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzYzMzE3NywiZXhwIjoyMTAzMjA5MTc3fQ.-3pFyBLu28GY1zlWd2yNQp2V4s8qH3ia-BQ_9HwePJk"
        run: |
          node scripts/upload-to-supabase.mjs JustUS.apk JustUS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustUS-Android-APK
          path: JustUS.apk

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "JustUS Latest App Releases"
          draft: false
          prerelease: false
          files: |
            JustUS.apk
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
