version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2024.11-node
    environment:
      JVM_OPTS: -Xmx3200m

  ios-executor:
    macos:
      xcode: "15.4.0"

jobs:
  build-android-apk:
    executor: android-executor
    steps:
      - checkout
      - run:
          name: Install Node.js 24 & Verify Java
          command: |
            echo "Installing Node.js 24 directly..."
            curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
            sudo apt-get install -y nodejs
            echo 'export PATH="/usr/bin:/usr/local/bin:$PATH"' >> "$BASH_ENV"
            node -v
            npm -v
            java -version || true
      - run:
          name: Install Dependencies
          command: |
            npm --prefix apps/web install
      - run:
          name: Build Next.js App & Sync Android
          command: |
            cd apps/web
            mkdir -p out android/app/src/main/assets
            npm run build
            npx --yes @capacitor/cli sync android
      - run:
          name: Build Debug APK with Gradle
          command: |
            cd apps/web/android
            chmod +x gradlew
            ./gradlew assembleDebug
      - run:
          name: Prepare APK Output
          command: |
            cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk JustUS.apk
      - run:
          name: Upload APK to Supabase Storage
          command: |
            node scripts/upload-to-supabase.mjs JustUS.apk JustUS.apk
      - store_artifacts:
          path: JustUS.apk
          destination: JustUS.apk
      - run:
          name: Release APK to GitHub Releases
          command: |
            if [ -n "$GITHUB_TOKEN" ] && { [ "$CIRCLE_BRANCH" = "main" ] || [ "$CIRCLE_BRANCH" = "master" ]; }; then
              echo "Publishing APK to GitHub Release 'latest'..."
              gh release upload latest JustUS.apk --clobber || echo "GitHub release upload skipped or completed with status $?"
            else
              echo "Skipping GitHub release: GITHUB_TOKEN not configured in CircleCI or not on main/master branch."
            fi

  build-ios-ipa:
    executor: ios-executor
    steps:
      - checkout
      - run:
          name: Install Node.js 24
          command: |
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              \. "$NVM_DIR/nvm.sh"
            else
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.0/install.sh | bash
              \. "$NVM_DIR/nvm.sh"
            fi
            nvm install 24
            nvm use 24
            nvm alias default 24
            echo 'export NVM_DIR="$HOME/.nvm"' >> "$BASH_ENV"
            echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> "$BASH_ENV"
            echo 'nvm use default' >> "$BASH_ENV"
            node -v
            npm -v
      - run:
          name: Install Dependencies
          command: |
            npm --prefix apps/web install
      - run:
          name: Build Next.js App & Sync iOS
          command: |
            cd apps/web
            mkdir -p out ios/App/App/public
            npm run build
            npx --yes @capacitor/cli sync ios
      - run:
          name: Build Unsigned iOS IPA
          command: |
            cd apps/web/ios/App
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
            mkdir -p Payload
            cp -r App.xcarchive/Products/Applications/App.app Payload/
            zip -r JustUS.ipa Payload/
      - run:
          name: Upload IPA to Supabase Storage
          command: |
            node scripts/upload-to-supabase.mjs apps/web/ios/App/JustUS.ipa JustUS.ipa
      - store_artifacts:
          path: apps/web/ios/App/JustUS.ipa
          destination: JustUS.ipa
      - run:
          name: Release IPA to GitHub Releases
          command: |
            if [ -n "$GITHUB_TOKEN" ] && { [ "$CIRCLE_BRANCH" = "main" ] || [ "$CIRCLE_BRANCH" = "master" ]; }; then
              echo "Publishing IPA to GitHub Release 'latest'..."
              gh release upload latest apps/web/ios/App/JustUS.ipa --clobber || echo "GitHub release upload skipped or completed with status $?"
            else
              echo "Skipping GitHub release: GITHUB_TOKEN not configured in CircleCI or not on main/master branch."
            fi

workflows:
  build-apps:
    jobs:
      - build-android-apk:
          filters:
            branches:
              only:
                - main
                - master
      - build-ios-ipa:
          filters:
            branches:
              only:
                - main
                - master